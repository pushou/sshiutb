name: Build and verify LaTeX

# Déclenché sur toute pull request et sur toute poussée vers main.
# Le job "compile" est le check obligatoire protégé sur main :
# une PR ne peut être fusionnée que s'il est vert.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: compile (LaTeX)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install TeXLive and Pygments
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            cm-super \
            texlive-lang-french \
            python3-pygments
          pygmentize -V

      # minted2.sty n'existe que dans TeXLive Debian ; il est embarqué dans le
      # dépôt (licence LPPL, cf. en-tête du fichier) pour que la compilation
      # fonctionne aussi sur Ubuntu, où seul minted (v3) est disponible.
      # cm-super fournit les polices Type1 scalables T1 requises par
      # fontfamily=helvetica + microtype (auto-expansion).
      - name: Verify bundled minted2.sty
        run: |
          test -s minted2.sty || { echo "::error::minted2.sty embarqué absent"; exit 1; }
          ls -l minted2.sty

      - name: Verify the document is self-contained
        run: |
          # Formes \input{...}, \input ... (sans accolades), \include, \import,
          # \subfile ; les lignes de commentaire (%) sont ignorees et
          # \includegraphics / \includeonly ne correspondent pas.
          if grep -nE '^[^%]*\\(input|include|import|subfile)([^a-zA-Z]|$)' ssh-indep.tex; then
            echo "::error::ssh-indep.tex dépend d'un fichier externe : le document doit rester autonome."
            exit 1
          fi
          echo "Autonomie vérifiée : aucune dépendance externe dans le source."

      - name: Compile with latexmk (shell-escape for minted)
        run: |
          latexmk -pdf -shell-escape -halt-on-error \
                  -interaction=nonstopmode \
                  ssh-indep.tex

      - name: Fail if the PDF was not produced
        run: |
          test -s ssh-indep.pdf || { echo "::error::ssh-indep.pdf absent ou vide"; exit 1; }
          ls -l ssh-indep.pdf

      - name: Check for fatal LaTeX errors in the log
        run: |
          if grep -nE '^! ' ssh-indep.log; then
            echo "::error::erreurs LaTeX détectées dans ssh-indep.log"
            exit 1
          fi
          echo "Compilation sans erreur fatale."

      # File de latexmk : liste réelle des fichiers lus pendant la compilation.
      # Aucun ne doit sortir du dépôt (../ ou chemin absolu hors dépôt) : c'est
      # la preuve d'autonomie la plus forte, indépendante du source.
      - name: Verify no file outside the repository was read
        run: |
          if grep -nE '^INPUT (\./)?\.\.' ssh-indep.fls; then
            echo "::error::le document lit un fichier hors du dépôt."
            exit 1
          fi
          echo "Autonomie vérifiée : $(grep -c '^INPUT' ssh-indep.fls) fichiers lus, tous dans le dépôt."

      - name: Upload the compiled PDF
        uses: actions/upload-artifact@v7
        with:
          name: ssh-indep-pdf
          path: ssh-indep.pdf
          if-no-files-found: error
